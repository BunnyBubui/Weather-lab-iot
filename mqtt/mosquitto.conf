# mosquitto.conf
# Lab / academic project configuration.
# WARNING: allow_anonymous true is NOT suitable for production (see SRS Section 34).
# For production: enable password_file + TLS listener on 8883.

listener 1883
protocol mqtt

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
